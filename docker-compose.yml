services:
  mongodb:
    image: mongo:7
    container_name: harbingermongo
    restart: always
    volumes:
      - mongodata:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harbingbackend
    restart: always
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-net
    ports:
      - "8082:5000"

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8082/api
    container_name: harbingfrontend
    restart: always
    depends_on:
      - backend-api
    networks:
      - frontend-net
      - backend-net
    ports:
      - "3300:3000"

volumes:
  mongodata:

networks:
  backend-net:
  frontend-net:
